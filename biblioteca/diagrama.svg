<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidade-relacionamento da biblioteca</title>
  <desc id="desc">Quatro tabelas: autores, livros, leitores e emprestimos, ligadas por três relacionamentos um para muitos.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.box{fill:#fff;stroke:#334155;stroke-width:2}.head{fill:#2563eb}.name{fill:#fff;font:700 20px Arial}.field{fill:#172033;font:16px Arial}.key{fill:#a16207;font:700 14px Arial}.line{fill:none;stroke:#475569;stroke-width:3}.card{fill:#334155;font:700 17px Arial}.label{fill:#475569;font:14px Arial}.heading{fill:#172033;font:700 28px Arial}
    </style>
    <marker id="many" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 M10 6 L1 6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="heading" x="600" y="42" text-anchor="middle">Biblioteca — Diagrama de Banco de Dados</text>

  <!-- AUTORES -->
  <g transform="translate(60 90)">
    <rect class="box" width="390" height="190" rx="8"/><path class="head" d="M8 0H382Q390 0 390 8V48H0V8Q0 0 8 0Z"/>
    <text class="name" x="20" y="31">AUTORES</text>
    <text class="key" x="20" y="80">PK</text><text class="field" x="62" y="80">id_autor  INTEGER</text>
    <text class="field" x="62" y="118">nome  TEXT NOT NULL</text>
    <text class="field" x="62" y="156">nacionalidade  TEXT NOT NULL</text>
  </g>

  <!-- LIVROS -->
  <g transform="translate(750 70)">
    <rect class="box" width="390" height="250" rx="8"/><path class="head" d="M8 0H382Q390 0 390 8V48H0V8Q0 0 8 0Z"/>
    <text class="name" x="20" y="31">LIVROS</text>
    <text class="key" x="20" y="78">PK</text><text class="field" x="62" y="78">id_livro  INTEGER</text>
    <text class="field" x="62" y="112">titulo  TEXT NOT NULL</text>
    <text class="field" x="62" y="146">ano_publicacao  INTEGER</text>
    <text class="field" x="62" y="180">genero  TEXT NOT NULL</text>
    <text class="field" x="62" y="214">quantidade  INTEGER</text>
    <text class="key" x="20" y="242">FK</text><text class="field" x="62" y="242">id_autor  INTEGER</text>
  </g>

  <!-- LEITORES -->
  <g transform="translate(60 450)">
    <rect class="box" width="390" height="220" rx="8"/><path class="head" d="M8 0H382Q390 0 390 8V48H0V8Q0 0 8 0Z"/>
    <text class="name" x="20" y="31">LEITORES</text>
    <text class="key" x="20" y="82">PK</text><text class="field" x="62" y="82">id_leitor  INTEGER</text>
    <text class="field" x="62" y="122">nome  TEXT NOT NULL</text>
    <text class="field" x="62" y="162">email  TEXT UNIQUE</text>
    <text class="field" x="62" y="202">telefone  TEXT NOT NULL</text>
  </g>

  <!-- EMPRESTIMOS -->
  <g transform="translate(750 410)">
    <rect class="box" width="390" height="280" rx="8"/><path class="head" d="M8 0H382Q390 0 390 8V48H0V8Q0 0 8 0Z"/>
    <text class="name" x="20" y="31">EMPRÉSTIMOS</text>
    <text class="key" x="20" y="82">PK</text><text class="field" x="62" y="82">id_emprestimo  INTEGER</text>
    <text class="key" x="20" y="126">FK</text><text class="field" x="62" y="126">id_livro  INTEGER</text>
    <text class="key" x="20" y="170">FK</text><text class="field" x="62" y="170">id_leitor  INTEGER</text>
    <text class="field" x="62" y="214">data_emprestimo  TEXT</text>
    <text class="field" x="62" y="258">data_devolucao  TEXT (NULL)</text>
  </g>

  <!-- Relacionamentos 1:N -->
  <path class="line" d="M450 210 H600 V195 H750" marker-end="url(#many)"/>
  <text class="card" x="470" y="200">1</text><text class="card" x="718" y="185">N</text>
  <text class="label" x="600" y="181" text-anchor="middle">escreve</text>

  <path class="line" d="M945 320 V410" marker-end="url(#many)"/>
  <text class="card" x="956" y="348">1</text><text class="card" x="956" y="397">N</text>
  <text class="label" x="975" y="375">é emprestado</text>

  <path class="line" d="M450 565 H750" marker-end="url(#many)"/>
  <text class="card" x="470" y="552">1</text><text class="card" x="718" y="552">N</text>
  <text class="label" x="600" y="552" text-anchor="middle">realiza</text>
</svg>
